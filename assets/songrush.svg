<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'JetBrains Mono','D2Coding','Consolas','Menlo',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1412"/><stop offset="1" stop-color="#2e1a16"/></linearGradient>
  </defs>
  <rect width="800" height="320" rx="18" fill="url(#bg)"/>
  <text x="28" y="38" font-size="15" fill="#fed7aa">SongRushApp / 애니 OP·ED 맞히기</text>
  <text x="28" y="62" font-size="13" fill="#fdba74" opacity="0.75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif">모두가 같은 순간에 듣고 · 서버에 먼저 도착한 정답만 득점 · AI 에이전트 팀으로 개발</text>

  <!-- player -->
  <rect x="50" y="84" width="300" height="206" rx="16" fill="#292120" stroke="#44342f"/>
  <text x="70" y="112" font-size="14" font-weight="700" fill="#fed7aa">1 / 10</text>
  <rect x="140" y="104" width="150" height="6" rx="3" fill="#44342f"/>
  <rect x="140" y="104" width="150" height="6" rx="3" fill="#ff8a4c">
    <animate attributeName="width" values="150;150;80;80" keyTimes="0.0000;0.0100;0.5200;1.0000" dur="10s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0.0000;0.1200" dur="10s" repeatCount="indefinite"/><text x="330" y="112" font-size="14" font-weight="700" fill="#fed7aa" text-anchor="end">90초</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.1200;0.2400" dur="10s" repeatCount="indefinite"/><text x="330" y="112" font-size="14" font-weight="700" fill="#fed7aa" text-anchor="end">78초</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.2400;0.3600" dur="10s" repeatCount="indefinite"/><text x="330" y="112" font-size="14" font-weight="700" fill="#fed7aa" text-anchor="end">66초</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.3600;0.4800" dur="10s" repeatCount="indefinite"/><text x="330" y="112" font-size="14" font-weight="700" fill="#fed7aa" text-anchor="end">54초</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.4800" dur="10s" repeatCount="indefinite"/><text x="330" y="112" font-size="14" font-weight="700" fill="#fed7aa" text-anchor="end">42초</text></g>
  <g transform="translate(200 186)">
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
      <circle r="62" fill="#120c0b" stroke="#ff8a4c" stroke-width="2"/>
      <circle r="46" fill="none" stroke="#3a2a26"/><circle r="32" fill="none" stroke="#3a2a26"/>
      <circle r="18" fill="#ffcf70"/><circle r="4" fill="#120c0b"/>
      <rect x="-3" y="-62" width="6" height="16" rx="2" fill="#ff8a4c"/>
    </g>
  </g>
  <path d="M318 126 L300 150 L262 206" fill="none" stroke="#a8a29e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="318" cy="126" r="7" fill="#57534e"/>
  
  <text x="170" y="136" font-size="18" fill="#ffcf70" text-anchor="middle" opacity="0">♪
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0.0000;0.0300;0.0600;0.1900;1.0000" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -28;0 -28" keyTimes="0.0000;0.0300;0.1900;1.0000" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="234" y="136" font-size="18" fill="#ffcf70" text-anchor="middle" opacity="0">♪
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0.0000;0.1500;0.1800;0.3100;1.0000" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -28;0 -28" keyTimes="0.0000;0.1500;0.3100;1.0000" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="190" y="136" font-size="18" fill="#ffcf70" text-anchor="middle" opacity="0">♪
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0.0000;0.2700;0.3000;0.4300;1.0000" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -28;0 -28" keyTimes="0.0000;0.2700;0.4300;1.0000" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="240" y="136" font-size="18" fill="#ffcf70" text-anchor="middle" opacity="0">♪
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0.0000;0.3900;0.4200;0.5500;1.0000" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -28;0 -28" keyTimes="0.0000;0.3900;0.5500;1.0000" dur="10s" repeatCount="indefinite"/>
  </text>
  
  <g transform="translate(200 196)"><g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.5800;0.6050;1.0000" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="0.6;0.6;1.08;1;1" keyTimes="0.0000;0.5800;0.6050;0.6200;1.0000" dur="10s" repeatCount="indefinite"/>
    <rect x="-118" y="-68" width="236" height="136" rx="12" fill="#1c1412" stroke="#ffcf70" stroke-width="2"/>
    <rect x="-104" y="-54" width="80" height="108" rx="6" fill="#ff8a4c"/>
    <circle cx="-48" cy="-28" r="14" fill="#fff7ed"/>
    <path d="M-104 54 L-80 10 L-62 32 L-44 4 L-24 54 Z" fill="#1c1412" opacity="0.75"/>
    <rect x="-8" y="-46" width="58" height="18" rx="9" fill="#ff8a4c"/><text x="21" y="-33" font-size="11" font-weight="700" fill="#1c1412" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif">정답</text>
    <text x="-8" y="-4" font-size="22" font-weight="800" fill="#fff7ed" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif">나루토</text>
    <text x="-8" y="18" font-size="12" fill="#d6d3d1">NARUTO</text>
    <text x="-8" y="44" font-size="11" fill="#a8a29e" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif">OP 1 · 한·영·일·로마자</text>
  </g></g>

  <!-- chat -->
  <rect x="380" y="84" width="380" height="206" rx="16" fill="#241b1a" stroke="#44342f"/>
  <text x="740" y="104" font-size="11" fill="#78716c" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif">채팅으로 제목 맞히기</text>
  
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.0900" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0" keyTimes="0.0000;0.0900;0.1100;1.0000" dur="10s" repeatCount="indefinite"/>
    <text x="404" y="120" font-size="14" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif"><tspan fill="#38bdf8" font-weight="700">민수</tspan><tspan fill="#f5f5f4" dx="12">진격의 거인?</tspan></text>
  </g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.1250" dur="10s" repeatCount="indefinite"/><text x="736" y="120" font-size="14" fill="#f87171" text-anchor="end">✗</text></g>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.2100" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0" keyTimes="0.0000;0.2100;0.2300;1.0000" dur="10s" repeatCount="indefinite"/>
    <text x="404" y="152" font-size="14" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif"><tspan fill="#f472b6" font-weight="700">지수</tspan><tspan fill="#f5f5f4" dx="12">원피스</tspan></text>
  </g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.2450" dur="10s" repeatCount="indefinite"/><text x="736" y="152" font-size="14" fill="#f87171" text-anchor="end">✗</text></g>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.3300" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0" keyTimes="0.0000;0.3300;0.3500;1.0000" dur="10s" repeatCount="indefinite"/>
    <text x="404" y="184" font-size="14" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif"><tspan fill="#38bdf8" font-weight="700">민수</tspan><tspan fill="#f5f5f4" dx="12">귀멸의 칼날</tspan></text>
  </g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.3650" dur="10s" repeatCount="indefinite"/><text x="736" y="184" font-size="14" fill="#f87171" text-anchor="end">✗</text></g>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.4700" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0" keyTimes="0.0000;0.4700;0.4900;1.0000" dur="10s" repeatCount="indefinite"/>
    <text x="404" y="216" font-size="14" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif"><tspan fill="#a3e635" font-weight="700">두두</tspan><tspan fill="#f5f5f4" dx="12">나루토</tspan></text>
  </g>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0000;0.5200" dur="10s" repeatCount="indefinite"/>
    <rect x="396" y="228" width="344" height="30" rx="15" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e"/>
    <text x="568" y="248" font-size="14" font-weight="700" fill="#86efac" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif">✔ 두두 정답! · 서버에 먼저 도착한 1명만 득점</text>
  </g>
