    <circle cx="815" cy="44" r="24" fill="#fef3c7" opacity="0.9" filter="url(#glow)"/>
    <circle cx="858" cy="76" r="9" fill="#bae6fd" opacity="0.85" filter="url(#glow)"/>
    <path d="M0 280 L0 232 L90 196 L170 226 L260 184 L350 222 L430 200 L520 230 L610 190 L700 220 L800 186 L900 214 L900 280 Z" fill="#2e1065" opacity="0.85"/>
    <path d="M0 280 L0 252 L120 230 L240 256 L380 236 L520 258 L660 238 L780 256 L900 240 L900 280 Z" fill="#1e1b4b"/>
  </g>

  <!-- summoning circle: full strength in the dark, then fades behind the title -->
  <g filter="url(#glow)">
    <animate attributeName="opacity" from="1" to="0.22" begin="1.5s" dur="0.6s" fill="freeze"/>
    
  <g>
    <circle cx="450.0" cy="140" r="112" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="704" stroke-dashoffset="704"><animate attributeName="stroke-dashoffset" from="704" to="0" begin="0.1s" dur="0.8s" fill="freeze"/></circle><circle cx="450.0" cy="140" r="80" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="503" stroke-dashoffset="503"><animate attributeName="stroke-dashoffset" from="503" to="0" begin="0.35s" dur="0.8s" fill="freeze"/></circle><polygon points="450.0,60.0 519.3,180.0 380.7,180.0" fill="none" stroke="#a5f3fc" stroke-width="1.5" stroke-dasharray="416" stroke-dashoffset="416"><animate attributeName="stroke-dashoffset" from="416" to="0" begin="0.6s" dur="0.7s" fill="freeze"/></polygon><polygon points="450.0,220.0 380.7,100.0 519.3,100.0" fill="none" stroke="#a5f3fc" stroke-width="1.5" stroke-dasharray="416" stroke-dashoffset="416"><animate attributeName="stroke-dashoffset" from="416" to="0" begin="0.75s" dur="0.7s" fill="freeze"/></polygon>
    <path id="rune" d="M 354.0 140 a 96 96 0 1 1 192 0 a 96 96 0 1 1 -192 0" fill="none"/>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/>
      <text font-size="10.5" fill="#67e8f9"><textPath href="#rune" xlink:href="#rune">public static void main · SELECT * FROM world · git commit -m isekai · while(alive) learn() · </textPath></text>
      <animateTransform attributeName="transform" type="rotate" from="0 450.0 140" to="360 450.0 140" dur="40s" repeatCount="indefinite"/>
    </g>
  </g>
  </g>

  <rect width="900" height="280" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;1;0" begin="1.3s" dur="0.8s" fill="freeze"/>
  </rect>

  <g font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" text-anchor="middle">
    <g opacity="0"><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="1.9s" dur="0.7s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.7s" fill="freeze"/>
      <rect x="416.0" y="44" width="68" height="26" rx="13" fill="#000" fill-opacity="0.35" stroke="#fde68a"/>
      <text x="450.0" y="62" font-size="14" font-weight="700" fill="#fde68a">제1화</text>
    </g>
    <g opacity="0"><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="2.3s" dur="0.7s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.7s" fill="freeze"/>
      <text x="450.0" y="152" font-size="46" font-weight="900" fill="url(#gold)" filter="url(#glow)">어둠의 개발자가 되고 싶어서!</text>
    </g>
    <g opacity="0"><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="3.7s" dur="0.7s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.7s" fill="freeze"/>
      <text x="450.0" y="204" font-size="15" fill="#e9d5ff" letter-spacing="2">— 두두 (doodoo) —</text>
    </g>
  </g>
  </g>
</svg>
