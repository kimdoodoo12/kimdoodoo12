Name="opacity" values="0.15;0.95;0.15" dur="3.8s" begin="1.7s" repeatCount="indefinite"/></circle><circle cx="412" cy="128" r="2.1" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.4s" begin="2.0s" repeatCount="indefinite"/></circle><circle cx="72" cy="110" r="1.7" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="5.0s" begin="2.5s" repeatCount="indefinite"/></circle><circle cx="265" cy="67" r="1.7" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="2.1s" begin="1.4s" repeatCount="indefinite"/></circle><circle cx="165" cy="31" r="0.9" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.3s" begin="0.4s" repeatCount="indefinite"/></circle><circle cx="233" cy="68" r="2.0" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="2.2s" begin="1.3s" repeatCount="indefinite"/></circle><circle cx="493" cy="134" r="1.9" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.6s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="377" cy="63" r="2.0" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.9s" begin="0.5s" repeatCount="indefinite"/></circle><circle cx="172" cy="46" r="1.1" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.5s" begin="1.8s" repeatCount="indefinite"/></circle><circle cx="246" cy="16" r="1.4" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.1s" begin="1.7s" repeatCount="indefinite"/></circle><circle cx="840" cy="108" r="1.5" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.9s" begin="2.0s" repeatCount="indefinite"/></circle><circle cx="66" cy="136" r="1.9" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.6s" begin="2.4s" repeatCount="indefinite"/></circle><circle cx="357" cy="69" r="0.9" fill="#fff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.9s" begin="0.2s" re