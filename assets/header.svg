<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 280" width="900" height="280" font-family="'JetBrains Mono','D2Coding','Consolas','Menlo',monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="0.55" stop-color="#4c1d95"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="280" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="900" height="280" fill="#05060f"/>

  <!-- the other world (revealed by the flash) -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4000000000000001s" dur="0.4s" fill="freeze"/>
    <rect width="900" height="280" fill="url(#sky)"/>
